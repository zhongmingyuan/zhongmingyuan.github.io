<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Name - Personal Website</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #f7f5f0;
            --surface: #ffffff;
            --text: #1d1f24;
            --muted: #5d6270;
            --border: #e4e0d6;
            --accent: #3b5bdb;
            --accent-soft: rgba(59, 91, 219, 0.10);
            --hero-from: #e8ecfb;
            --hero-to: #f7f5f0;
            --shadow: 0 1px 2px rgba(20, 22, 30, 0.04), 0 8px 24px rgba(20, 22, 30, 0.06);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #111318;
                --surface: #181b22;
                --text: #e9eaee;
                --muted: #9aa0ad;
                --border: #262a33;
                --accent: #8ea6ff;
                --accent-soft: rgba(142, 166, 255, 0.12);
                --hero-from: #1a2036;
                --hero-to: #111318;
                --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 24px rgba(0, 0, 0, 0.25);
            }
        }

        *, *::before, *::after { box-sizing: border-box; }

        body {
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
            line-height: 1.65;
            margin: 0;
            padding: 0;
            color: var(--text);
            background: var(--bg);
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            text-align: center;
            padding: 5rem 1.5rem 3rem;
            background:
                radial-gradient(60rem 30rem at 50% -10%, var(--hero-from), var(--hero-to) 70%);
        }

        .profile-img {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            display: block;
            object-fit: cover;
            margin: 0 auto 1.5rem;
            border: 4px solid var(--surface);
            box-shadow: 0 0 0 1px var(--border), var(--shadow);
            background: linear-gradient(135deg, #8ea6ff, #3b5bdb 55%, #1d2b6b);
            color: transparent; /* hide alt text if the image fails to load */
            font-size: 0;
        }

        h1 {
            font-family: 'Fraunces', Georgia, serif;
            font-weight: 600;
            font-size: clamp(2rem, 5vw, 2.75rem);
            letter-spacing: -0.02em;
            line-height: 1.15;
            margin: 0 0 0.5rem;
        }

        header p {
            margin: 0;
            color: var(--muted);
            font-size: 1.05rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            font-weight: 500;
        }

        .social-links {
            margin: 2rem 0 0;
            display: flex;
            justify-content: center;
            gap: 0.75rem;
            flex-wrap: wrap;
        }

        .social-links a {
            color: var(--text);
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 500;
            padding: 0.55rem 1.25rem;
            border-radius: 999px;
            border: 1px solid var(--border);
            background: var(--surface);
            box-shadow: var(--shadow);
            transition: transform 0.15s ease, border-color 0.15s ease, color 0.15s ease;
        }

        .social-links a:hover {
            color: var(--accent);
            border-color: var(--accent);
            transform: translateY(-1px);
        }

        .container {
            width: 100%;
            max-width: 760px;
            margin: 0 auto;
            padding: 1rem 1.5rem 4rem;
            flex: 1;
        }

        section {
            margin: 2.5rem 0;
        }

        h2 {
            font-family: 'Fraunces', Georgia, serif;
            font-weight: 600;
            font-size: 1.6rem;
            letter-spacing: -0.01em;
            margin: 0 0 1rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        h2::after {
            content: "";
            flex: 1;
            height: 1px;
            background: var(--border);
        }

        #about p {
            margin: 0;
            padding: 1.5rem 1.75rem;
            background: var(--surface);
            border: 1px solid var(--border);
            border-left: 3px solid var(--accent);
            border-radius: 12px;
            box-shadow: var(--shadow);
            font-size: 1.05rem;
        }

        .projects {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1rem;
            padding: 2.5rem 1.5rem;
            text-align: center;
            color: var(--muted);
            font-style: italic;
            border: 1.5px dashed color-mix(in srgb, var(--accent) 35%, var(--border));
            border-radius: 12px;
            background: var(--accent-soft);
        }

        .project-card {
            background: var(--surface);
            border: 1px solid var(--border);
            padding: 1.25rem;
            border-radius: 12px;
            box-shadow: var(--shadow);
        }

        footer {
            text-align: center;
            padding: 1.5rem 1rem;
            border-top: 1px solid var(--border);
            color: var(--muted);
            font-size: 0.875rem;
        }

        footer p { margin: 0; }
    </style>
</head>
<body>
    <header>
        <img src="/api/placeholder/150/150" alt="Your Profile Picture" class="profile-img">
        <h1>Mingyuan Zhong, Ph.D.</h1>
        <p>Product AI developer</p>
        <div class="social-links">
            <a href="https://github.com/zhongmingyuan">GitHub</a>
            <a href="https://www.linkedin.com/in/mingyuan-zhong-1397ab2a/">LinkedIn</a>
        </div>
    </header>

    <div class="container">
        <section id="about">
            <h2>About Me</h2>
            <p>Interests: AI(Machine Learning, Reinforcement Learning, Generative AI), Product, Data Science, and Data Engineering</p>
        </section>

        <section id="projects">
            <h2>Projects</h2>
            <div class="projects">
                To be updated
            </div>
        </section>
    </div>

    <footer>
        <p>&copy; 2025 Mingyuan Zhong. All rights reserved.</p>
    </footer>
</body>
</html>
